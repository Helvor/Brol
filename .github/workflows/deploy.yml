# Teste le site puis le publie sur GitHub Pages.
# Réglage requis : Settings → Pages → Source : « GitHub Actions ».
name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test-results/

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers du site
        run: |
          mkdir _site && cp -r index.html style.css logo.svg manifest.webmanifest *.js data vendor icons _site/
          # Service worker : un cache par version (voir sw.js)
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/" _site/sw.js
          # Numéro de version sur les fichiers locaux (app.js?v=abc1234) : après un déploiement,
          # les navigateurs ne mélangent pas d'anciens fichiers en cache avec les nouveaux.
          V="${GITHUB_SHA::7}"
          sed -E -i "s/(src|href)=\"([^\":?]+\.(js|css))\"/\1=\"\2?v=$V\"/g" _site/index.html
          grep -o '="[^"]*?v=[^"]*"' _site/index.html
          # Version affichée en bas de la page : date du déploiement et commit, avec un lien vers ce commit
          D="$(date -u +%Y.%m.%d)"
          sed -i "s|<span class=\"version\" id=\"version\">[^<]*</span>|<a class=\"version\" id=\"version\" href=\"https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\" target=\"_blank\" rel=\"noopener\">v$D · $V</a>|" _site/index.html
          grep -o "v$D · $V" _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
